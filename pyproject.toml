[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heatguard"
version = "0.1.0"
description = "Adaptive WBGT-driven work-rest-hydration scheduler for outdoor labour crews in the Gulf"
readme = "README.md"
# Floor matches Dockerfile runtime (python:3.12-slim-bookworm).
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pythermalcomfort==4.0.1",
    "thermofeel==2.2.0",
    # Numerical-correctness control — float drift can flip ACGIH work-rest boundaries.
    "numpy==1.26.4",
    "httpx>=0.24,<0.29",
    "structlog>=24.1,<26",
    "prometheus-client>=0.20,<0.23",
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
    "opentelemetry-instrumentation-fastapi>=0.48b0,<1",
    "opentelemetry-instrumentation-httpx>=0.48b0,<1",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
]

[project.optional-dependencies]
# FastAPI / Uvicorn are pre-1.0: minors are breaking — exclusive single-minor windows.
# Starlette 1.x follows the same exclusive-minor discipline.
api = [
    "fastapi>=0.141.0,<0.142.0",
    "uvicorn[standard]>=0.52.0,<0.53.0",
    "starlette>=1.3.0,<1.4.0",
    "redis>=5.2,<6",
]
ml = ["scikit-learn>=1.4,<1.10", "joblib>=1.3,<1.6"]
demo = ["streamlit>=1.30,<1.50", "pandas>=2.0,<3", "altair>=5.0,<6"]
dev = [
    "pytest>=7,<10",
    "pytest-cov>=5,<8",
    "packaging>=23,<26",
    # Offline monitoring policy validation (scripts/validate_monitoring.py, WO-017).
    "pyyaml>=6.0.1,<7",
]
# Tooling extras — never install into the production image (WO-011).
deck = ["python-pptx>=0.6.21,<2"]
notebook = ["nbformat>=5.9,<6", "matplotlib>=3.8,<4"]

[project.scripts]
heatguard = "heatguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "network: tests that hit the public internet (skipped by default)",
    "slow: long-running golden regeneration / season replay tests",
]
addopts = "-m 'not network'"
testpaths = ["tests"]

[tool.uv]
package = true
