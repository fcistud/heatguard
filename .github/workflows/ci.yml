name: CI

on:
  push:
    branches: [main]
  pull_request:

# Interpreter matrix for golden parity. Keep 3.11 (pre-upgrade / Dockerfile)
# required; 3.12 is the migration target and may fail until WO-008 lands.
env:
  GOLDEN_PYTHON_VERSIONS: "3.11, 3.12"
  CANONICAL_PYTHON: "3.11"
  CANONICAL_NODE: "24"
  UV_VERSION: "0.12.1"

permissions:
  contents: read

jobs:
  version-drift:
    name: Interpreter version drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.CANONICAL_PYTHON }}
      - name: Assert Dockerfile / CI / requires-python agree
        run: python scripts/ci_version_drift.py --ci-python "${{ env.CANONICAL_PYTHON }}"
      - name: Assert Dockerfile / CI / engines.node agree
        run: python scripts/ci_node_version_drift.py --ci-node "${{ env.CANONICAL_NODE }}"

  python-tests:
    name: Python engine + API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.CANONICAL_PYTHON }}
      - name: Install uv (pinned)
        run: pip install "uv==${{ env.UV_VERSION }}"
      - name: Sync frozen lock (api + ml + dev)
        run: uv sync --frozen --extra api --extra ml --extra dev
      - name: Assert numerics pins match golden capture
        run: |
          uv run python - <<'PY'
          from importlib.metadata import version
          assert version("numpy") == "1.26.4", version("numpy")
          assert version("pythermalcomfort") == "4.0.1"
          assert version("thermofeel") == "2.2.0"
          print("OK — numpy/pythermalcomfort/thermofeel match golden MANIFEST pins")
          PY
      - name: Run tests
        run: uv run pytest -q

  dependency-determinism:
    name: Dependency resolution determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.CANONICAL_PYTHON }}
      - name: Install uv (pinned)
        run: pip install "uv==${{ env.UV_VERSION }}"
      - name: Resolve frozen set twice and diff
        run: python scripts/check_dependency_determinism.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: resolved-dependency-set
          path: artifacts/resolved-deps.txt
          if-no-files-found: ignore

  tooling-extras-smoke:
    name: Deck + notebook extras (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ env.CANONICAL_PYTHON }}
      - name: Install uv (pinned)
        run: pip install "uv==${{ env.UV_VERSION }}"
      - name: Sync base + deck + notebook only
        run: uv sync --frozen --extra deck --extra notebook
      - name: Smoke builders offline
        run: |
          set -euo pipefail
          uv run python scripts/build_deck.py --dry-run
          OUT=$(mktemp -d)/heatguard_validation.ipynb
          MPLBACKEND=Agg uv run python notebooks/build_validation_notebook.py --output "$OUT"
          test -s "$OUT"
          echo "OK — tooling extras smoke passed"

  golden-parity:
    name: Golden parity (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the post-upgrade target. Until WO-008 proves parity, treat
        # 3.12 drift as an explicit signal (job still reports) without blocking
        # merges — required check is Golden parity (Python 3.11).
        python-version: ["3.11", "3.12"]
    continue-on-error: ${{ matrix.python-version == '3.12' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv (pinned)
        run: pip install "uv==${{ env.UV_VERSION }}"
      - name: Sync frozen lock
        run: uv sync --frozen --extra api --extra ml --extra dev
      - name: Assert numpy pin
        run: uv run python -c "from importlib.metadata import version; assert version('numpy')=='1.26.4', version('numpy')"
      - name: Golden check (offline — networking disabled in harness)
        id: golden
        run: |
          set -euo pipefail
          mkdir -p artifacts/golden-diff
          uv run python - <<'PY'
          import json, platform, sys
          from importlib.metadata import version
          from pathlib import Path
          from heatguard import golden

          meta = {
              "python_version": sys.version.split()[0],
              "platform": platform.platform(),
              "packages": {
                  "numpy": version("numpy"),
                  "pythermalcomfort": version("pythermalcomfort"),
                  "thermofeel": version("thermofeel"),
                  "scikit-learn": version("scikit-learn"),
              },
          }
          Path("artifacts/golden-diff/run_manifest.json").write_text(
              json.dumps(meta, indent=2, sort_keys=True) + "\n"
          )
          diffs = golden.check_against_committed()
          if diffs:
              shown = diffs[:20]
              report = "\n".join(shown)
              if len(diffs) > 20:
                  report += f"\n… and {len(diffs) - 20} more"
              Path("artifacts/golden-diff/diff.txt").write_text(report + "\n")
              for site in golden.demo_site_keys():
                  src = golden.GOLDEN_DIR / site / "MANIFEST.json"
                  if src.exists():
                      Path(f"artifacts/golden-diff/{site}-MANIFEST.json").write_bytes(src.read_bytes())
              print("GOLDEN MISMATCH:")
              print(report)
              raise SystemExit(1)
          print("OK — golden tree is byte-identical.")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: golden-diff-py${{ matrix.python-version }}
          path: artifacts/golden-diff/
          if-no-files-found: ignore

  web-build:
    name: React dashboard build + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install + lint + test + build
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run test
          npm run build
      - name: Assert Vite base path + manual chunks
        working-directory: web
        run: |
          set -euo pipefail
          test -f dist/index.html
          grep -q '/dashboard/' dist/index.html || grep -q 'dashboard' dist/index.html
          ls dist/assets/*.js | head
          # Manual chunks from vite.config (react / charts) should appear when split.
          ls dist/assets/ | tee /tmp/assets.txt
          grep -E 'react|charts|index' /tmp/assets.txt

  container-smoke:
    name: Container image smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build image
        run: docker build -t heatguard:ci .
      - name: Assert tooling extras absent from runtime closure
        run: |
          set -euo pipefail
          docker run --rm -i --entrypoint python heatguard:ci - <<'PY'
          from importlib.metadata import distributions
          names = {d.metadata["Name"].lower() for d in distributions()}
          forbidden = {"python-pptx", "nbformat", "matplotlib"}
          hit = sorted(forbidden & names)
          assert not hit, f"tooling extras leaked into runtime image: {hit}"
          print("OK — deck/notebook packages absent from runtime closure")
          PY
      - name: Serve dashboard + health
        run: |
          set -euo pipefail
          docker run -d --name hg -p 8080:8080 heatguard:ci
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/health >/dev/null; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8080/health | tee /tmp/health.json
          curl -sfI http://127.0.0.1:8080/dashboard/ | head -n 20 | tee /tmp/dash.hdr
          grep -qi '200\|text/html' /tmp/dash.hdr
          # Fetch one hashed asset if present
          ASSET=$(curl -sf http://127.0.0.1:8080/dashboard/ | grep -oE '/dashboard/assets/[^"]+\.js' | head -1 || true)
          if [ -n "$ASSET" ]; then
            curl -sfI "http://127.0.0.1:8080${ASSET}" | tee /tmp/asset.hdr
            grep -qi '200\|javascript\|text/javascript\|application/javascript' /tmp/asset.hdr
          fi
          docker rm -f hg
