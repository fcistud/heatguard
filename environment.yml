# HeatGuard — shared Conda environment (cross-platform)
# ======================================================
# Works with Miniforge, Miniconda, Anaconda, or Mambaforge on macOS, Linux, and Windows.
# Python 3.11 from conda-forge (osx-arm64, osx-64, linux-64, win-64).
# Floor stays on 3.11 until WO-008 raises the lock + runtime to 3.12.
#
# SETUP (run from the repository root — the folder that contains this file)
# -------------------------------------------------------------------------
#   git clone <repo-url> && cd heatguard
#   conda env create -f environment.yml
#   conda activate heatguard
#
# Prefer uv when available (authoritative lock):
#   uv sync --frozen --extra api --extra ml --extra dev
#
# Mamba users: replace `conda` with `mamba` (same file, faster solves).
#
# VERIFY
# ------
#   pytest -q
#   heatguard sites
#   heatguard demo dubai
#
# FULL DEMO (API + React dashboard — needs Node.js 24 / npm 11 separately)
# -----------------------------------------------------------------------
#   uvicorn heatguard.api:app --reload          # http://localhost:8000
#   cd web && npm ci && npm run dev             # http://localhost:5173
#   # or: scripts/run_demo.sh
#
# RECREATE ENV FROM SCRATCH
# -------------------------
#   conda env remove -n heatguard -y
#   conda env create -f environment.yml
#
# TROUBLESHOOTING
# ---------------
# - Run create/update from the repo root (paths below are relative to this file).
# - Use Python 3.11 for now — WO-008 moves the supported floor to 3.12.
# - If `heatguard` is missing after activate: pip install -e .
# - No Conda? Prefer: uv sync --frozen --extra api --extra ml --extra dev
#   Or: python3.11 -m venv .venv && pip install -r requirements.txt && pip install -e ".[api,ml,dev]"
#
name: heatguard
channels:
  - conda-forge
channel_priority: strict
dependencies:
  - python=3.11
  - pip>=24
  - setuptools>=68
  - wheel
  - pip:
      # Lock-derived (hash-pinned) runtime/API set, then editable package.
      - -r requirements.txt
      - -e ".[api,ml,dev]"
