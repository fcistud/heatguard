# Cloud Build → Artifact Registry → Cloud Run
# Manual submit: gcloud builds submit --config cloudbuild.yaml
#
# Uses $BUILD_ID for image tags (always set). $COMMIT_SHA is only set on repo triggers.
# Deploy uses the immutable image digest (not :latest).
#
# Canary / rollback contract (WO-017 — see docs/RUNBOOKS.md#automated-rollback-and-canary):
#   Progression: 10% → 50% → 100% traffic with 15-minute holds at each step.
#   Abort and shift traffic to the previous revision when any trigger fires:
#     - 5xx rate > 1% over 5 minutes
#     - warm p95 > 800 ms over 5 minutes
#     - any heatguard_compliance_chain_verify_total{result="failed"} increment
#   Investor demo: pin 100% to a known-good revision (pinned-revision protection).
#   This file still deploys directly today; canary traffic splits land with the
#   deployment-pipeline story — keep the thresholds above in sync with alerts.
#
# Substitutions (override with --substitutions=KEY=VALUE):
#   _REGION       Cloud Run region (default us-central1)
#   _SERVICE      Cloud Run service name (default heatguard)
#   _AR_REPO      Artifact Registry repo name (default heatguard)

substitutions:
  _REGION: us-central1
  _SERVICE: heatguard
  _AR_REPO: heatguard

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:latest
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}"
        DIGEST="$(gcloud artifacts docker images describe "${IMAGE}:$BUILD_ID" \
          --format='get(image_summary.digest)')"
        echo "Deploying ${IMAGE}@${DIGEST}"
        gcloud run deploy "${_SERVICE}" \
          --image="${IMAGE}@${DIGEST}" \
          --region="${_REGION}" \
          --platform=managed \
          --allow-unauthenticated \
          --memory=1Gi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=3 \
          --timeout=120 \
          --project="$PROJECT_ID" \
          --set-env-vars="HEATGUARD_DATA_DIR=/app/data,HEATGUARD_CACHE_DIR=/var/cache/heatguard,HEATGUARD_STATIC_DIR=/app/static,HEATGUARD_LANDING_DIR=/app/landing,NUMBA_CACHE_DIR=/tmp/numba_cache" \
          --add-volume=name=hg-cache,type=in-memory,size-limit=256Mi \
          --add-volume-mount=volume=hg-cache,mount-path=/var/cache/heatguard \
          --add-volume=name=hg-tmp,type=in-memory,size-limit=128Mi \
          --add-volume-mount=volume=hg-tmp,mount-path=/tmp \
          --startup-probe=initialDelaySeconds=40,timeoutSeconds=5,periodSeconds=10,failureThreshold=6,httpGet.port=8080,httpGet.path=/health/ready \
          --liveness-probe=timeoutSeconds=5,periodSeconds=30,failureThreshold=3,httpGet.port=8080,httpGet.path=/health/live

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
